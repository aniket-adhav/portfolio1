<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <symbol id="profile-en" viewBox="0 0 80 760">

      <!-- Top dot + line -->
      <circle cx="40" cy="12" r="4" fill="currentColor" opacity="0.6"/>
      <line x1="40" y1="20" x2="40" y2="44" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>

      <!-- ANIKET — bold vertical text -->
      <text
        x="40"
        y="52"
        writing-mode="vertical-rl"
        text-anchor="start"
        font-family="'Gotham', 'Inter', 'Arial Black', system-ui, sans-serif"
        font-size="52"
        font-weight="900"
        letter-spacing="14"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="1"
        paint-order="stroke fill"
      >ANIKET</text>

      <!-- Separator -->
      <line x1="10" y1="488" x2="70" y2="488" stroke="currentColor" stroke-width="1" opacity="0.3"/>

      <!-- ADHAV — lighter below -->
      <text
        x="40"
        y="502"
        writing-mode="vertical-rl"
        text-anchor="start"
        font-family="'Gotham', 'Inter', 'Arial Black', system-ui, sans-serif"
        font-size="52"
        font-weight="900"
        letter-spacing="14"
        fill="currentColor"
        stroke="currentColor"
        stroke-width="0.5"
        paint-order="stroke fill"
        opacity="0.28"
      >ADHAV</text>

      <!-- Bottom line + dot -->
      <line x1="40" y1="736" x2="40" y2="750" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
      <circle cx="40" cy="756" r="4" fill="currentColor" opacity="0.6"/>

    </symbol>
  </defs>
</svg>
